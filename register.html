<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Load Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
</head>
<body>
    <header>
        <a href="index.html" class="logo">Nocturnal Gaming</a>
        <nav id="nav-menu">
            <a href="index.html">Home</a>
            <a href="index.html#games">Games</a>
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <span id="auth-links">
                <a href="login.html">Login</a>
                <a href="register.html" class="active">Register</a>
            </span>
        </nav>
    </header>

    <div class="main-content">
        <div class="card">
            <div style="text-align: center; margin-bottom: 20px;">
                <h2>Create Account</h2>
                <p style="font-size: 13px; color: #aaa;">Join Nocturnal Gaming for cloud saves & leaderboards</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Display Name</label>
                    <input type="text" id="username" placeholder="e.g. NocturnalMatt" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>
                <div id="error-msg" style="color: #ff5252; font-size: 12px; margin-bottom: 15px; display: none;"></div>
                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13px;">
                Already have an account? <a href="login.html" style="color: #00bcd4; text-decoration: none;">Log In</a>
            </div>
        </div>
    </div>

    <footer>
        <p>Copyright © 2026 Nocturnal Gaming | <a href="privacy.html">Privacy Policy</a> | <a href="terms.html">Terms of Service</a></p>
    </footer>

    <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const username = document.getElementById('username').value;
        const errorDiv = document.getElementById('error-msg');

        const { data, error } = await supabase.auth.signUp({ email, password });
        
        if (error) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = error.message;
            return;
        }

        if (data.user) {
            const { error: profileError } = await supabase
                .from('profiles')
                .insert([{ id: data.user.id, display_name: username }]);
                
            if (profileError) {
                console.error("Profile creation warning:", profileError.message);
            }
        }

        window.location.href = 'dashboard.html';
    });
    </script>
</body>
</html>
