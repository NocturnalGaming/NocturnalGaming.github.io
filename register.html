<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Create Account</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/header.js" defer></script>
</head>
<body>

<!-- Header injected dynamically via js/header.js -->

<div class="main-content">
    <div class="card">
        <h2>Create Account</h2>
        <p class="subtitle">Join Nocturnal Gaming for cloud saves & leaderboards</p>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Display Name</label>
                <input type="text" id="username" placeholder="e.g. NocturnalMatt" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 6 characters" required>
            </div>
            <div id="error-msg" style="color: #ff5252; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="redirect-text">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>
</div>

<footer>
    <p>
        Copyright © 2026 Nocturnal Gaming |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const username = document.getElementById('username').value;
    const errorDiv = document.getElementById('error-msg');

    const { data, error } = await window.supabaseInstance.auth.signUp({ email, password });
    
    if (error) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = error.message;
        return;
    }

    if (data.user) {
        const { error: profileError } = await window.supabaseInstance
            .from('profiles')
            .insert([{ id: data.user.id, display_name: username }]);
            
        if (profileError) {
            console.error("Profile creation warning:", profileError.message);
        }
    }

    window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
