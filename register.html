<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Create Account</title>
    <!-- Google Fonts matching clean modern style -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            width: 100%;
            max-width: 440px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #2d2d2d;
        }

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .logo-area p {
            font-size: 13px;
            color: #aaaaaa;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cccccc;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #00bcd4; /* Vibrant accent matching dark layout styles */
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #cccccc;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: #00bcd4;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #121212;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #e0e0e0;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #888888;
        }

        .footer-links a {
            color: #00bcd4;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .login-redirect {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #bbbbbb;
        }

        .login-redirect a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
        }

        .login-redirect a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-area">
            <h1>Nocturnal Gaming</h1>
            <p>Create your account to sync progress and access cloud saves</p>
        </div>

        <form action="/api/register" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 6 characters" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Repeat Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Re-enter password" required>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="notifications" name="notifications" checked>
                <label for="notifications" style="margin-bottom: 0; cursor: pointer;">Receive updates and game notifications via email</label>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="login-redirect">
            Already have an account? <a href="/login">Log In</a>
        </div>

        <div class="footer-links">
            By registering, you agree to our <a href="/terms">Terms of Service</a> & <a href="/privacy">Privacy Policy</a>.
        </div>
    </div>

</body>
</html>
