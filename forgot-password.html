<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Reset Password</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/header.js" defer></script>
</head>
<body>

<!-- Header injected dynamically via js/header.js -->

<div class="main-content">
    <div class="card">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your email and we'll send you a recovery link</p>

        <form id="forgot-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div id="status-msg" style="font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="redirect-text">
            Remember your password? <a href="login.html">Log In</a>
        </div>
    </div>
</div>

<footer>
    <p>
        Copyright © 2026 Nocturnal Gaming |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const statusDiv = document.getElementById('status-msg');

    statusDiv.style.display = 'block';
    statusDiv.style.color = 'var(--text-gray)';
    statusDiv.innerText = 'Sending reset link...';

    // Request password reset email through Supabase
    const { error } = await window.supabaseInstance.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html',
    });

    if (error) {
        statusDiv.style.color = '#ff5252';
        statusDiv.innerText = error.message;
    } else {
        statusDiv.style.color = '#4ade80';
        statusDiv.innerText = 'Password reset link sent! Check your email inbox.';
    }
});
</script>

</body>
</html>
