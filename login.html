<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Log In</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/header.js" defer></script>
</head>
<body>

<!-- Header injected dynamically via js/header.js -->

<div class="main-content">
    <div class="card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your Nocturnal Gaming account</p>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <div id="error-msg" style="color: #ff5252; font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn-submit">Log In</button>
            <div class="form-group" style="text-align: right; margin-top: -0.5rem; margin-bottom: 1.5rem;">
    <a href="forgot-password.html" style="font-size: 0.85rem; color: var(--text-gray); text-decoration: none;">Forgot password?</a>
</div>
        </form>

        <div class="redirect-text">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</div>

<footer>
    <p>
        Copyright © 2026 Nocturnal Gaming |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-msg');

    const { error } = await window.supabaseInstance.auth.signInWithPassword({ email, password });

    if (error) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = error.message;
        return;
    }

    window.location.href = 'dashboard.html';
});
</script>

</body>
</html>
