<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Profile</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/header.js" defer></script>
</head>
<body>

<!-- Header injected dynamically via js/header.js -->

<div class="main-content">
    <div class="card">
        <h2>Edit Profile</h2>
        <p class="subtitle">Update your player display name</p>

        <form id="profile-form">
            <div class="form-group">
                <label for="display-name">Display Name</label>
                <input type="text" id="display-name" required>
            </div>
            <div id="status-msg" style="font-size: 0.85rem; margin-bottom: 1rem; display: none;"></div>
            <button type="submit" class="btn-submit">Save Changes</button>
        </form>
    </div>
</div>

<footer>
    <p>
        Copyright © 2026 Nocturnal Gaming |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const supabase = window.supabaseInstance;
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
        window.location.href = 'login.html';
        return;
    }

    const { data: profile } = await supabase
        .from('profiles')
        .select('display_name')
        .eq('id', session.user.id)
        .single();

    if (profile) {
        document.getElementById('display-name').value = profile.display_name || '';
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newName = document.getElementById('display-name').value;
        const statusDiv = document.getElementById('status-msg');

        const { error } = await supabase
            .from('profiles')
            .update({ display_name: newName })
            .eq('id', session.user.id);

        statusDiv.style.display = 'block';
        if (error) {
            statusDiv.style.color = '#ff5252';
            statusDiv.innerText = error.message;
        } else {
            statusDiv.style.color = '#4ade80';
            statusDiv.innerText = 'Profile updated successfully!';
        }
    });
});
</script>

</body>
</html>
