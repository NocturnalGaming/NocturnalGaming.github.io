<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocturnal Gaming - Dashboard</title>
    <link rel="icon" type="image/jpeg" href="images/favicon.jpg">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js" defer></script>
    <script src="js/header.js" defer></script>
</head>
<body>

<!-- Header injected dynamically via js/header.js -->

<div class="main-content">
    <div class="card" style="max-width: 500px;">
        <h2 id="display-name-heading">Player Dashboard</h2>
        <p class="subtitle" id="user-email">Loading account data...</p>

        <div class="stats-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div class="stat-box" style="background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; text-align: center;">
                <span style="display: block; font-size: 0.85rem; color: var(--text-gray); margin-bottom: 0.25rem;">Member Since</span>
                <strong id="join-date" style="font-size: 1.2rem; color: var(--accent-glow);">-</strong>
            </div>
            <div class="stat-box" style="background-color: var(--bg-dark); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; text-align: center;">
                <span style="display: block; font-size: 0.85rem; color: var(--text-gray); margin-bottom: 0.25rem;">Cloud Status</span>
                <strong style="font-size: 1.2rem; color: #4ade80;">Active</strong>
            </div>
        </div>

        <div class="btn-group" style="display: flex; flex-direction: column; gap: 0.75rem;">
            <a href="profile.html" class="btn btn-primary" style="background-color: var(--accent-purple); color: white; padding: 0.75rem; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold;">Edit Profile / Display Name</a>
            <a href="logout.html" class="btn btn-secondary" style="background-color: var(--border-color); color: #ff5252; padding: 0.75rem; text-align: center; border-radius: 6px; text-decoration: none; font-weight: bold;">Log Out</a>
        </div>
    </div>
</div>

<footer>
    <p>
        Copyright © 2026 Nocturnal Gaming |
        <a href="privacy.html">Privacy Policy</a> |
        <a href="terms.html">Terms of Service</a>
    </p>
</footer>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const supabase = window.supabaseInstance;
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
        window.location.href = 'login.html';
        return;
    }

    const user = session.user;
    document.getElementById('user-email').innerText = user.email;
    
    const dateStr = new Date(user.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    document.getElementById('join-date').innerText = dateStr;

    const { data: profile } = await supabase
        .from('profiles')
        .select('display_name')
        .eq('id', user.id)
        .single();

    if (profile && profile.display_name) {
        document.getElementById('display-name-heading').innerText = profile.display_name;
    }
});
</script>

</body>
</html>
